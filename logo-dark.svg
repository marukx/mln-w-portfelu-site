<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="100%" height="100%">
  <defs>
    <!-- Gradient dla ikony -->
    <linearGradient id="chartGradientDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtelna poświata dla wykresu -->
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ikona wykresu -->
  <g transform="translate(10, 10)">
    <path 
      d="M 4 28 L 12 22 L 20 25 L 32 10 L 24 10 M 32 10 L 32 18" 
      fill="none" 
      stroke="url(#chartGradientDark)" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#glowDark)"
    />
    <circle cx="32" cy="28" r="7" fill="none" stroke="#2dd4bf" stroke-width="2" />
    <text x="32" y="31.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#2dd4bf" text-anchor="middle">zł</text>
  </g>

  <!-- Tekst: MLN w Portfelu -->
  <text x="60" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    MLN <tspan fill="#818cf8" font-weight="400">w</tspan> <tspan fill="#2dd4bf" font-weight="600">Portfelu</tspan>
  </text>
</svg>
