<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="100%" height="100%">
  <defs>
    <!-- Kontrastowy gradient dla jasnego tła -->
    <linearGradient id="chartGradientLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Ikona wykresu -->
  <g transform="translate(10, 10)">
    <path 
      d="M 4 28 L 12 22 L 20 25 L 32 10 L 24 10 M 32 10 L 32 18" 
      fill="none" 
      stroke="url(#chartGradientLight)" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <circle cx="32" cy="28" r="7" fill="none" stroke="#0d9488" stroke-width="2" />
    <text x="32" y="31.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#0d9488" text-anchor="middle">zł</text>
  </g>

  <!-- Tekst: MLN w Portfelu -->
  <text x="60" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
    MLN <tspan fill="#6366f1" font-weight="400">w</tspan> <tspan fill="#0d9488" font-weight="600">Portfelu</tspan>
  </text>
</svg>
